name: Exact replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Replay every verifier except the 9-vertex run, and check SHA256SUMS
        run: python -S -O -B verify_all.py --sums
      - name: Semantic negative controls
        run: python -S -O -B negative_controls.py
